spring.application.name=cardiosense-java
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cardiosense}
spring.data.mongodb.auto-index-creation=true
spring.jackson.property-naming-strategy=SNAKE_CASE
server.port=${PORT:8081}
cardiosense.jwt.secret=${SECRET_KEY}
cardiosense.jwt.access-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:30}
cardiosense.jwt.refresh-days=${REFRESH_TOKEN_EXPIRE_DAYS:7}
cardiosense.model-service.url=${MODEL_SERVICE_URL:http://127.0.0.1:8080}
