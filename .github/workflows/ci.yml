name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: heart-disease
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          pip install --only-binary=:all: -r requirements-dev.txt
          pip install --only-binary=:all: -r requirements.txt

      - name: Run backend pytest suite
        working-directory: heart-disease
        run: python -m pytest --maxfail=1 --disable-warnings

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: heart-disease/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: heart-disease/ui
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: heart-disease/ui
        run: npm run test

      - name: Build frontend
        working-directory: heart-disease/ui
        run: npm run build

  quality-gate:
    name: Quality gate
    needs:
      - backend-tests
      - frontend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required repo structure
        run: |
          test -f sonar-project.properties
          test -d .github/workflows
          test -d heart-disease/ui
