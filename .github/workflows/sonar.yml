name: SonarQube

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Sonar scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: heart-disease
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          pip install --require-hashes --only-binary=:all: -r requirements-dev.lock.txt
          pip install --require-hashes --only-binary=:all: -r requirements.lock.txt

      - name: Install frontend dependencies
        working-directory: heart-disease/ui
        run: npm ci --ignore-scripts

      - name: Run backend tests with coverage
        working-directory: heart-disease
        run: |
          python -m pytest --cov=src --cov-report=xml --maxfail=1 --disable-warnings

      - name: Run frontend tests with coverage
        working-directory: heart-disease/ui
        run: npm run test:coverage

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
