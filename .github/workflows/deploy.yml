name: Deploy application

on:
  workflow_run:
    workflows:
      - CI
      - SonarQube
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production

    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: heart-disease
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend check
        working-directory: heart-disease
        run: python -m compileall src

      - name: Install frontend dependencies
        working-directory: heart-disease/ui
        run: npm ci

      - name: Build frontend
        working-directory: heart-disease/ui
        run: npm run build

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Azure App Service
        if: ${{ env.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: heart-disease

      - name: Deploy frontend to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APP_NAME != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_branch: main
          app_location: heart-disease/ui
          output_location: dist

      - name: Deployment reminder
        run: |
          echo "Set the following repository secrets/variables before enabling deployment:"
          echo "- AZURE_CREDENTIALS"
          echo "- AZURE_STATIC_WEB_APPS_API_TOKEN"
          echo "- AZURE_WEBAPP_NAME"
          echo "- AZURE_STATIC_WEB_APP_NAME"
          echo "- AZURE_RESOURCE_GROUP"
          echo "- AZURE_LOCATION"
