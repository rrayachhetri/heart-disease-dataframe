name: Deploy application

on:
  workflow_run:
    workflows:
      - CI
      - SonarQube
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production

    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: heart-disease
        run: |
          python -m pip install --upgrade pip --only-binary=:all:
          pip install --require-hashes --only-binary=:all: -r requirements.lock.txt

      - name: Compile backend check
        working-directory: heart-disease
        run: python -m compileall src

      - name: Install frontend dependencies
        working-directory: heart-disease/ui
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: heart-disease/ui
        run: npm run build

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Azure App Service
        if: ${{ env.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: heart-disease

      - name: Deploy frontend to Azure Static Web Apps
        if: ${{ env.AZURE_STATIC_WEB_APP_NAME != '' }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_branch: main
          app_location: heart-disease/ui
          output_location: dist

      - name: Deployment reminder
        run: |
          echo "Set the following repository secrets/variables before enabling deployment:"
          echo "- AZURE_CREDENTIALS"
          echo "- AZURE_STATIC_WEB_APPS_API_TOKEN"
          echo "- AZURE_WEBAPP_NAME"
          echo "- AZURE_STATIC_WEB_APP_NAME"
          echo "- AZURE_RESOURCE_GROUP"
          echo "- AZURE_LOCATION"
