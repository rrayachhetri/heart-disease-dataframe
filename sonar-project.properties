sonar.projectKey=heart-disease
sonar.projectName=heart-disease
sonar.organization=your-sonarcloud-organization
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=heart-disease/src,heart-disease/ui/src
sonar.tests=heart-disease/tests,heart-disease/ui/src

sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.vite/**,**/coverage/**,.github/**
sonar.test.inclusions=**/*_spec.py,**/*.spec.ts,**/*.spec.tsx

sonar.python.version=3.11
sonar.python.coverage.reportPaths=heart-disease/coverage.xml
sonar.javascript.lcov.reportPaths=heart-disease/ui/coverage/lcov.info
